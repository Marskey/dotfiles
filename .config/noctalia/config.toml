[accessibility]
ui_scale = 1.2500000111758709

[backdrop]
enabled = true

[bar.default]
background_opacity = 0.69999998435378075
end = [ "tray", "notifications", "network", "bluetooth", "battery", "control-center", "session" ]
start = [ "workspaces" ]

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 267.5
    cy = 249.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"
        color = "on_surface"
        format = "{:%H:%M}"
        shadow = true
        timezone = ""

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 732.0
    cy = 732.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.69999998435378075

[osd]
background_opacity = 0.69999998435378075

[shell]
font_family = "Adwaita Sans"
telemetry_enabled = true

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    polkit_placement = "attached"
    transparency_mode = "glass"

[theme]
builtin = "Kanagawa"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [ "ghostty", "niri" ]

[wallpaper.default]
path = "/home/marskey/Pictures/Wallpapers/wallhaven-e82xxr.jpg"

[wallpaper.last]
path = "/home/marskey/Pictures/Wallpapers/wallhaven-e82xxr.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/marskey/Pictures/Wallpapers/wallhaven-e82xxr.jpg"

[widget.battery]
scale = 1.5
show_label = false

[widget.control-center]
glyph = "north-star"

[widget.network]
show_label = false
