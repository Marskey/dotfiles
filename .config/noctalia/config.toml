[accessibility]
ui_scale = 1.2500000111758709

[backdrop]
enabled = true

[bar.default]
background_opacity = 0.69999998435378075
end = [
    "cpu",
    "temp",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "battery",
    "control-center",
    "session"
]
start = [ "workspaces", "active_window" ]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 180.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

[location]
address = "fuzhou,china"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-widget-0000000000000002", "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 32
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 731.5
    cy = 716.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 128.0
    box_width = 352.0
    cx = 755.5
    cy = 393.0
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        background_color = "surface"
        background_opacity = 0.80000000000000004
        background_padding = 10
        background_radius = 12
        color = "on_surface"
        font_family = ""
        forecast_days = 3
        shadow = true
        show_forecast = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 192.0
    box_width = 352.0
    cx = 731.5
    cy = 233.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        format = "{:%H:%M}"

[notification]
background_opacity = 0.69999998435378075

[osd]
background_opacity = 0.69999998435378075

[shell]
font_family = "Adwaita Sans"
telemetry_enabled = true

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    polkit_placement = "attached"
    transparency_mode = "glass"

[theme]
builtin = "Kanagawa"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "ghostty", "niri" ]

[wallpaper.default]
path = "/home/marskey/Pictures/Wallpapers/wallhaven-e82xxr.jpg"

[wallpaper.last]
path = "/home/marskey/Pictures/Wallpapers/wallhaven-e82xxr.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/marskey/Pictures/Wallpapers/wallhaven-e82xxr.jpg"

[widget.active_window]
capsule = true
capsule_opacity = 0.5
font_weight = 380
title_scroll = "always"

[widget.battery]
display_mode = "graphic"
hide_when_full = true
show_label = false

[widget.clock]
format = "{:%H:%M  ·  %a  %b %-d}"
timezone = "Asia/Shanghai"

[widget.control-center]
glyph = "north-star"

[widget.cpu]
display = "text"

[widget.network]
show_label = false

[widget.temp]
display = "text"
